name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + testes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BeautyAgenda.slnx

      - name: Build
        run: dotnet build BeautyAgenda.slnx --no-restore -c Release -warnaserror

      - name: Unit tests
        run: dotnet test tests/BeautyAgenda.UnitTests --no-build -c Release --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      # Testcontainers starts a real SQL Server using the runner's Docker daemon.
      - name: Integration tests
        run: dotnet test tests/BeautyAgenda.IntegrationTests --no-build -c Release --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/TestResults/*.trx

  frontend:
    name: Frontend (tipos + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings 0
      - run: npm run build

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]
    env:
      # Only needed for compose interpolation; nothing is started here.
      MSSQL_SA_PASSWORD: ci-not-used-1A!
    steps:
      - uses: actions/checkout@v4
      - name: Build API and web images
        run: docker compose build api web
